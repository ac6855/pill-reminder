services:
  pill-reminder:
    # 用远程镜像时，在同目录 .env 里写：
    #   PILL_IMAGE=ghcr.io/OWNER/pill-reminder:latest
    # 不用镜像时保持默认，走本地构建
    image: ${PILL_IMAGE:-pill-reminder:latest}
    build:
      context: .
    container_name: pill-reminder
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: Asia/Shanghai
      PORT: "8787"
      # 允许补推的时间窗口（分钟）：服务若在该窗口内重启，仍会补发提醒
      GRACE_MINUTES: "5"
      DB_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data
