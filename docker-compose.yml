# 飞牛 FnOS 标准版｜更新：docker compose pull && docker compose up -d
services:
  pill-reminder:
    image: ghcr.io/ac6855/pill-reminder:latest
    container_name: pill-reminder
    pull_policy: missing
    ports:
      - "8787:8787"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8787
      - GRACE_MINUTES=5
      - DB_PATH=/app/data/app.db
    volumes:
      - /vol2/1000/Data/pill-reminder/data:/app/data
    restart: unless-stopped
