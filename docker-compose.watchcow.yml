# 飞牛 FnOS + WatchCow 版
#
# WatchCow（github.com/tf4fun/watchcow）监听 Docker 事件，把带 watchcow.enable=true
# 的容器注册成 FnOS 原生桌面应用，点开即用，不必记端口、不必进容器列表找。
# 用法：应用中心「本地安装」watchcow.fpk，再在 Docker 里新建项目粘贴本文件。
#
# ⚠️ 标签名对版本敏感：WatchCow v0.2 做过一次重命名，按 v0.1 的写法配会不生效。
#    旧（v0.1）              → 新（v0.2+，本文件用这套）
#    watchcow.title          → watchcow.display_name
#    watchcow.description    → watchcow.desc
#    watchcow.port           → watchcow.service_port
#    watchcow.appName        → watchcow.appname
services:
  pill-reminder:
    image: ghcr.io/ac6855/pill-reminder:latest
    container_name: pill-reminder
    ports:
      - "8787:8787"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8787
      - GRACE_MINUTES=5
      - DB_PATH=/app/data/app.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    labels:
      # ——— 应用级 ———
      watchcow.enable: "true"
      # 3–32 字符，需以字母或数字开头，仅允许 ASCII 字母、数字与 . _ -
      watchcow.appname: "pill-reminder"
      watchcow.display_name: "用药提醒"
      watchcow.desc: "定时推送到微信 + 手机打卡页 + 表格化配置，数据存本机 SQLite"

      # ——— 入口级 ———
      watchcow.service_port: "8787"
      watchcow.protocol: "http"
      watchcow.path: "/"

      # 图标：dashboard-icons 里没有医药类条目（pill / pharmacy / medication 均 404），
      # 所以用仓库自带的图标，避免依赖第三方 CDN 的收录。
      watchcow.icon: "https://raw.githubusercontent.com/ac6855/pill-reminder/main/icons/pill-reminder.png"
      # 想换成本地图标（支持 PNG/JPEG/WebP/BMP/ICO，按内容识别格式，不看扩展名）：
      #   watchcow.icon: "file://./icons/pill-reminder.png"
      # 注意 file:// 相对路径的基准是 compose 文件所在目录，图标要先上传到 NAS。

      # 打开方式：url = 浏览器新标签页（默认）；iframe = 像原生应用一样内嵌桌面窗口
      # watchcow.ui_type: "iframe"
      # 访问权限：true = 所有用户可见（默认），false = 仅管理员
      # watchcow.all_users: "false"
