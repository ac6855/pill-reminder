# 飞牛 FnOS + WatchCow｜标签名对应 WatchCow v0.2+
services:
  pill-reminder:
    image: ghcr.io/ac6855/pill-reminder:latest
    container_name: pill-reminder
    pull_policy: missing
    ports:
      - "8787:8787"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8787
      - GRACE_MINUTES=5
      - DB_PATH=/app/data/app.db
    volumes:
      - /vol2/1000/Data/pill-reminder/data:/app/data
    restart: unless-stopped
    labels:
      watchcow.enable: "true"
      watchcow.appname: "pill-reminder"
      watchcow.display_name: "用药提醒"
      watchcow.desc: "定时推送 + 打卡 + 表格配置，数据存本机 SQLite"
      watchcow.service_port: "8787"
      watchcow.protocol: "http"
      watchcow.path: "/"
      watchcow.icon: "file:///vol2/1000/Data/icons/pill-reminder.png"
